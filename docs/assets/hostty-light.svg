<svg xmlns="http://www.w3.org/2000/svg" width="432" height="198" viewBox="40 163 432 198" role="img" aria-label="Hostty: three little ghosts in a line, each with a terminal prompt for a face">
  <defs>
    <!-- One ghost, 120 wide, with a ">_" face. The bottom has two ripples and rounded corners. -->
    <path id="body" d="M0 60 C0 27 27 0 60 0 C93 0 120 27 120 60 L120 122 C120 134 112 142 104 142 C96 142 90 132 82 132 S68 142 60 142 S46 132 38 132 S24 142 16 142 C8 142 0 134 0 122 Z"/>
    <g id="face" fill="none" stroke="#1a1b26" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="32,54 52,70 32,86"/>
      <line x1="62" y1="88" x2="88" y2="88"/>
    </g>
  </defs>

  <!-- Ghosts -->
  <g transform="translate(60 183)">
    <use href="#body" fill="#7fb24a"/>
    <use href="#face"/>
  </g>
  <g transform="translate(196 183)">
    <use href="#body" fill="#5a8ef0"/>
    <use href="#face"/>
  </g>
  <g transform="translate(332 183)">
    <use href="#body" fill="#a07ef0"/>
    <use href="#face"/>
  </g>

  <!-- Line under the ghosts -->
  <line x1="60" y1="341" x2="452" y2="341" stroke="#565f89" stroke-width="10" stroke-linecap="round"/>
</svg>
