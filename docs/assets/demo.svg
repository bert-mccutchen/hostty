<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="Hostty adds a domain, then shows a Rails server, a Jekyll site, and Solid Queue in tabs, with the URL of each domain in the tab bar and a line of output selected for copying, then the web tab blinks yellow when a debugger call rings the bell">
  <style>
    text { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #c0caf5; white-space: pre; }
    .dim { fill: #565f89; }
    .green { fill: #9ece6a; }
    .blue { fill: #7aa2f7; }
    .yellow { fill: #e0af68; }
    .cyan { fill: #7dcfff; }
    .magenta { fill: #bb9af7; }
    .white { fill: #ffffff; }
    .bar { fill: #a9b1d6; }
    .selected { fill: #1a1b26; }
    .bold { font-weight: bold; }
    .title { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8a8fa8; }
    .badge { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1a1b26; }
  </style>

  <rect width="0" height="0" opacity="0">
    <animate id="loop" attributeName="opacity" values="0;0" dur="20s" begin="0s;loop.end"/>
  </rect>

  <defs>
    <clipPath id="typing">
      <rect x="40" y="70" width="0" height="24">
        <set attributeName="width" to="0" begin="loop.begin" dur="0.3s"/>
        <animate attributeName="width" values="0;7.5;15.3;23.1;30.9;38.7;70" keyTimes="0;0.14;0.3;0.42;0.6;0.74;0.88" calcMode="discrete" begin="loop.begin+0.3s" dur="0.7s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="dragging">
      <rect x="18" y="166" width="0" height="20">
        <set attributeName="width" to="0" begin="loop.begin" dur="6.5s"/>
        <animate attributeName="width" values="0;9.8;17.7;25.5;33.3;41.2;49;56.8;64.6;72.5;80.3;88.1;96;103.8;111.6;119.5;127.3;135.1;142.9;150.8;158.6;166.4;174.3;182.1;189.9;197.8;205.6;213.4;221.2;229.1;236.9;244.7;252.6;260.4;268.2;276.1;286" calcMode="discrete" begin="loop.begin+6.5s" dur="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="debugging">
      <rect x="72" y="298" width="0" height="24">
        <set attributeName="width" to="0" begin="loop.begin" dur="16.6s"/>
        <animate attributeName="width" values="0;10.3;18.2;26;33.8;41.7;49.5;57.3;65.1;73;80.8;88.6;96.5;104.3;112.1;125" keyTimes="0;0.06;0.12;0.17;0.24;0.31;0.36;0.42;0.5;0.55;0.62;0.68;0.75;0.81;0.88;0.94" calcMode="discrete" begin="loop.begin+16.6s" dur="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="419" rx="10" fill="#1a1b26" stroke="#2f3349"/>
  <rect x="0.5" y="0.5" width="759" height="32" rx="10" fill="#24283b"/>
  <rect x="0.5" y="22" width="759" height="11" fill="#24283b"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="380" y="20" text-anchor="middle" class="title">~/shop</text>

  <!-- Scene 1: start hostty and add the domains -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="loop.begin" dur="3.5s"/>
    <text x="20" y="86"><tspan class="green">$</tspan></text>
    <text x="40" y="86" clip-path="url(#typing)">hostty</text>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="loop.begin+1.3s" dur="2.2s"/>
      <text x="20" y="110"><tspan class="dim">12:00:01</tspan> <tspan class="white">hostty</tspan> <tspan class="dim">|</tspan> Adding https://shop.test for web on port 5000.</text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="loop.begin+2.1s" dur="1.4s"/>
      <text x="20" y="132"><tspan class="dim">12:00:02</tspan> <tspan class="white">hostty</tspan> <tspan class="dim">|</tspan> Adding https://docs.shop.test for docs on port 5100.</text>
    </g>
  </g>

  <!-- Tab view: help bar for scenes 2 to 5 -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="loop.begin+3.5s" dur="16.5s"/>
    <rect x="1" y="386" width="758" height="24" fill="#303030"/>
    <text x="14" y="403"><tspan class="dim">Switch: click or Shift+Tab | Scroll: history | </tspan><tspan class="white bold">[restart]</tspan><tspan class="dim"> | Quit: Ctrl-C twice</tspan></text>
  </g>

  <!-- Scene 2: the web tab, with a Rails server -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="loop.begin+3.5s" dur="4s"/>
    <rect x="1" y="40" width="758" height="24" fill="#303030"/>
    <rect x="12" y="40" width="70" height="24" fill="#005f87"/>
    <text x="22" y="57"><tspan class="green">●</tspan> <tspan class="white bold">web</tspan></text>
    <text x="96" y="57"><tspan class="green">●</tspan> docs</text>
    <text x="178" y="57"><tspan class="green">●</tspan> jobs</text>
    <text x="746" y="57" text-anchor="end" class="bar">https://shop.test</text>

    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+3.7s" dur="3.8s"/><text x="20" y="92">=&gt; Booting Puma</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+4.0s" dur="3.5s"/><text x="20" y="114">=&gt; Rails 8.0.1 application starting in development</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+4.3s" dur="3.2s"/><text x="20" y="136">=&gt; Run `bin/rails server --help` for more startup options</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+4.7s" dur="2.8s"/><text x="20" y="158">Puma starting in single mode...</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+5.0s" dur="2.5s"/><text x="20" y="180">* Listening on http://127.0.0.1:5000</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+5.2s" dur="2.3s"/><text x="20" y="202">Use Ctrl-C to stop</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+5.8s" dur="1.7s"/><text x="20" y="224">Started <tspan class="cyan">GET</tspan> "/" for 127.0.0.1</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+6.0s" dur="1.5s"/><text x="20" y="246">  Rendered <tspan class="yellow">products/index.html.erb</tspan> (Duration: 12.4ms)</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+6.2s" dur="1.3s"/><text x="20" y="268">Completed <tspan class="green">200 OK</tspan> in 42ms</text></g>

    <g opacity="0" clip-path="url(#dragging)">
      <set attributeName="opacity" to="1" begin="loop.begin+6.5s" dur="1.0s"/>
      <rect x="18" y="166" width="286" height="20" fill="#c0caf5"/>
      <text x="20" y="180" class="selected">* Listening on http://127.0.0.1:5000</text>
    </g>

    <circle cx="20" cy="176" r="3" fill="#ffffff" opacity="0">
      <set attributeName="opacity" to="0.9" begin="loop.begin+6.4s" dur="0.8s"/>
      <animate attributeName="cx" from="20" to="304" begin="loop.begin+6.5s" dur="0.6s" fill="freeze"/>
      <set attributeName="cx" to="20" begin="loop.begin" dur="6.5s"/>
    </circle>
  </g>

  <!-- Scene 3: a click on the docs tab, with a Jekyll site -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="loop.begin+7.5s" dur="3s"/>
    <rect x="1" y="40" width="758" height="24" fill="#303030"/>
    <rect x="86" y="40" width="80" height="24" fill="#005f87"/>
    <text x="22" y="57"><tspan class="green">●</tspan> web</text>
    <text x="96" y="57"><tspan class="green">●</tspan> <tspan class="white bold">docs</tspan></text>
    <text x="178" y="57"><tspan class="green">●</tspan> jobs</text>
    <text x="746" y="57" text-anchor="end" class="bar">https://docs.shop.test</text>

    <text x="20" y="92">Configuration file: /home/dev/shop/docs/_config.yml</text>
    <text x="20" y="114">            Source: /home/dev/shop/docs</text>
    <text x="20" y="136">       Destination: /home/dev/shop/docs/_site</text>
    <text x="20" y="158"> Incremental build: disabled. Enable with --incremental</text>
    <text x="20" y="180">      Generating...</text>
    <text x="20" y="202">                    done in <tspan class="green">0.412 seconds</tspan>.</text>
    <text x="20" y="224"> Auto-regeneration: enabled for '/home/dev/shop/docs'</text>
    <text x="20" y="246">    Server address: <tspan class="blue">http://127.0.0.1:5100/</tspan></text>
    <text x="20" y="268">  Server running... press ctrl-c to stop.</text>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+8.6s" dur="1.9s"/><text x="20" y="290">      Regenerating: 1 file(s) changed at 2025-01-01 12:00:09</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+8.9s" dur="1.6s"/><text x="20" y="312">                    _posts/2025-01-01-welcome.md</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+9.2s" dur="1.3s"/><text x="20" y="334">                    ...done in <tspan class="green">0.087 seconds</tspan>.</text></g>
  </g>

  <!-- Scene 4: Shift+Tab to the jobs tab, with Solid Queue -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="loop.begin+10.5s" dur="4.5s"/>
    <rect x="1" y="40" width="758" height="24" fill="#303030"/>
    <rect x="168" y="40" width="76" height="24" fill="#005f87"/>
    <g>
      <set attributeName="opacity" to="0" begin="loop.begin+13.2s" dur="1.8s"/>
      <text x="22" y="57"><tspan class="green">●</tspan> web</text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="loop.begin+13.2s" dur="1.8s"/>
      <text x="22" y="57"><tspan class="yellow">●</tspan> web</text>
      <rect x="20" y="43" width="12" height="18" fill="#303030" opacity="0">
        <animate attributeName="opacity" values="0;1" calcMode="discrete" begin="loop.begin+13.2s" dur="1s" repeatCount="2"/>
      </rect>
    </g>
    <text x="96" y="57"><tspan class="green">●</tspan> docs</text>
    <text x="178" y="57"><tspan class="green">●</tspan> <tspan class="white bold">jobs</tspan></text>

    <text x="20" y="92"><tspan class="magenta">SolidQueue-1.1.0</tspan> Started Supervisor (12.1ms)  pid: 48213</text>
    <text x="20" y="114"><tspan class="magenta">SolidQueue-1.1.0</tspan> Started Dispatcher (4.2ms)  pid: 48220, batch_size: 500</text>
    <text x="20" y="136"><tspan class="magenta">SolidQueue-1.1.0</tspan> Started Worker (3.9ms)  pid: 48221, queues: *</text>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+11.3s" dur="3.7s"/><text x="20" y="158">Performing <tspan class="yellow">WelcomeEmailJob</tspan> (Job ID: 7f3c9a) from SolidQueue(default)</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+11.7s" dur="3.3s"/><text x="20" y="180">  Delivered mail to customer@shop.test (21.6ms)</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+12.0s" dur="3.0s"/><text x="20" y="202">Performed <tspan class="yellow">WelcomeEmailJob</tspan> (Job ID: 7f3c9a) in <tspan class="green">38.2ms</tspan></text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+12.6s" dur="2.4s"/><text x="20" y="224">Performing <tspan class="yellow">OrderReceiptJob</tspan> (Job ID: 2b81d4) from SolidQueue(default)</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+12.9s" dur="2.1s"/><text x="20" y="246">Performed <tspan class="yellow">OrderReceiptJob</tspan> (Job ID: 2b81d4) in <tspan class="green">22.7ms</tspan></text></g>
  </g>

  <!-- Scene 5: a click on the web tab, stopped at a debugger call -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="loop.begin+15s" dur="5s"/>
    <rect x="1" y="40" width="758" height="24" fill="#303030"/>
    <rect x="12" y="40" width="70" height="24" fill="#005f87"/>
    <text x="22" y="57"><tspan class="green">●</tspan> <tspan class="white bold">web</tspan></text>
    <text x="96" y="57"><tspan class="green">●</tspan> docs</text>
    <text x="178" y="57"><tspan class="green">●</tspan> jobs</text>
    <text x="746" y="57" text-anchor="end" class="bar">https://shop.test</text>

    <text x="20" y="92">Started <tspan class="cyan">POST</tspan> "/orders" for 127.0.0.1</text>
    <text x="20" y="114">Processing by OrdersController#create as HTML</text>
    <text x="20" y="136">  Parameters: {"order" =&gt; {"product_id" =&gt; "3", "quantity" =&gt; "2"}}</text>
    <text x="20" y="158">[14, 18] in <tspan class="blue">~/shop/app/controllers/orders_controller.rb</tspan></text>
    <text x="20" y="180"><tspan class="dim">    14|</tspan>   def create</text>
    <text x="20" y="202"><tspan class="dim">    15|</tspan>     @order = Order.new(order_params)</text>
    <text x="20" y="224"><tspan class="yellow">=&gt;  16|</tspan>     <tspan class="magenta">debugger</tspan></text>
    <text x="20" y="246"><tspan class="dim">    17|</tspan>     if @order.save</text>
    <text x="20" y="268"><tspan class="dim">    18|</tspan>       redirect_to @order</text>
    <text x="20" y="290"><tspan class="yellow">=&gt;#0</tspan>  OrdersController#create at <tspan class="blue">~/shop/app/controllers/orders_controller.rb:16</tspan></text>
    <text x="20" y="312"><tspan class="cyan">(rdbg)</tspan></text>
    <text x="20" y="312" clip-path="url(#debugging)">       @order.quantity</text>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+18s" dur="2s"/><text x="20" y="334">2</text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+18.2s" dur="1.8s"/><text x="20" y="356"><tspan class="cyan">(rdbg)</tspan></text></g>
  </g>

  <!-- Click ripple on the docs tab -->
  <circle cx="124" cy="52" r="4" fill="none" stroke="#ffffff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0.9;0" begin="loop.begin+7.3s" dur="0.6s"/>
    <animate attributeName="r" from="4" to="18" begin="loop.begin+7.3s" dur="0.6s"/>
  </circle>

  <!-- Click ripple on the web tab -->
  <circle cx="47" cy="52" r="4" fill="none" stroke="#ffffff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0.9;0" begin="loop.begin+14.8s" dur="0.6s"/>
    <animate attributeName="r" from="4" to="18" begin="loop.begin+14.8s" dur="0.6s"/>
  </circle>

  <!-- Click ripple at the start of the drag -->
  <circle cx="20" cy="176" r="4" fill="none" stroke="#ffffff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0.9;0" begin="loop.begin+6.4s" dur="0.6s"/>
    <animate attributeName="r" from="4" to="18" begin="loop.begin+6.4s" dur="0.6s"/>
  </circle>

  <!-- Drag to copy badge -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="loop.begin+6.5s" dur="1.0s"/>
    <rect x="606" y="340" width="124" height="32" rx="7" fill="#c0caf5" stroke="#7aa2f7" stroke-width="2"/>
    <text x="668" y="361" text-anchor="middle" class="badge">Drag to copy</text>
  </g>

  <!-- Shift+Tab key badge -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="loop.begin+10.0s" dur="1.2s"/>
    <rect x="618" y="340" width="112" height="32" rx="7" fill="#c0caf5" stroke="#7aa2f7" stroke-width="2"/>
    <text x="674" y="361" text-anchor="middle" class="badge">Shift + Tab</text>
  </g>

  <!-- Bell badge -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="loop.begin+13.2s" dur="1.8s"/>
    <rect x="574" y="340" width="156" height="32" rx="7" fill="#c0caf5" stroke="#e0af68" stroke-width="2"/>
    <text x="652" y="361" text-anchor="middle" class="badge">Bell from debugger</text>
  </g>
</svg>
