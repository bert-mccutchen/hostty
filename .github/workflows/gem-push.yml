name: Ruby Gem
on:
  release:
    types:
      - published
jobs:
  build:
    if: ${{ github.event.release.target_commitish == 'main' }}
    name: Build ${{ matrix.platform }} gems
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            tasks: native:darwin
          - platform: linux
            os: ubuntu-latest
            tasks: native:linux build
    steps:
    - name: Echo the release
      run: echo "${{ github.event.release.tag_name }} from ${{ github.event.release.target_commitish }}"
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        submodules: true
    - name: Set up Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.17.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.10'
        bundler-cache: true
    - name: Build the gems
      run: bundle exec rake ${{ matrix.tasks }}
    - name: Upload the gems
      uses: actions/upload-artifact@v4
      with:
        name: gems-${{ matrix.platform }}
        path: pkg/*.gem

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Download the gems
      uses: actions/download-artifact@v4
      with:
        pattern: gems-*
        path: pkg
        merge-multiple: true
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.10'
    - name: Publish to GPR
      run: |
        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        printf -- "---\n:github: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
        for gem in pkg/*.gem; do
          gem push --KEY github --host https://rubygems.pkg.github.com/${OWNER} "$gem"
        done
      env:
        GEM_HOST_API_KEY: "Bearer ${{secrets.GITHUB_TOKEN}}"
        OWNER: ${{ github.repository_owner }}
    - name: Log in to RubyGems
      uses: rubygems/configure-rubygems-credentials@v1.0.0
    - name: Publish to RubyGems
      run: |
        for gem in pkg/*.gem; do
          gem push "$gem"
        done
