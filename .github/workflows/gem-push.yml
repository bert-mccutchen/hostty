name: Ruby Gem
on:
  release:
    types:
      - published
env:
  ZIG_VERSION: 0.17.1
jobs:
  build:
    if: ${{ github.event.release.target_commitish == 'main' }}
    name: Build ${{ matrix.platform }} gems
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            tasks: native:darwin
          - platform: linux
            os: ubuntu-latest
            tasks: native:linux build
    steps:
    - name: Echo the release
      run: echo "${{ github.event.release.tag_name }} from ${{ github.event.release.target_commitish }}"
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: true
    - name: Set up Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - name: Read the ghostty revision
      id: ghostty
      run: echo "revision=$(git rev-parse HEAD:vendor/ghostty)" >> "$GITHUB_OUTPUT"
    - name: Cache libghostty-vt
      uses: actions/cache@v6
      with:
        path: tmp/native
        key: libghostty-native-${{ matrix.platform }}-${{ steps.ghostty.outputs.revision }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('Rakefile') }}
    - name: Build the gems
      run: bundle exec rake ${{ matrix.tasks }}
    - name: Upload the gems
      uses: actions/upload-artifact@v7
      with:
        name: gems-${{ matrix.platform }}
        path: pkg/*.gem

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download the gems
      uses: actions/download-artifact@v8
      with:
        pattern: gems-*
        path: pkg
        merge-multiple: true
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
    - name: Log in to RubyGems
      uses: rubygems/configure-rubygems-credentials@v2.1.0
    - name: Publish to RubyGems
      run: |
        for gem in pkg/*.gem; do
          gem push "$gem"
        done
