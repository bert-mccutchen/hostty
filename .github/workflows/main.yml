name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3.5'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Build libghostty-vt
        run: bundle exec rake libghostty
      - name: Run the default task
        run: bundle exec rake

  native-gems:
    runs-on: ${{ matrix.os }}
    name: Platform gems for ${{ matrix.platform }}
    needs: build
    strategy:
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            tasks: native:darwin
          - platform: linux
            os: ubuntu-latest
            tasks: native:linux build

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true
      - name: Build the platform gems
        run: bundle exec rake ${{ matrix.tasks }}
      - name: Upload the gems
        uses: actions/upload-artifact@v4
        with:
          name: gems-${{ matrix.platform }}
          path: pkg/*.gem
